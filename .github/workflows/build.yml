name: Build KARIN AI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: karin-ai-main
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/windows/KarinDesktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore
      - name: Publish Windows x64
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ../../../publish
      - name: Install Inno Setup
        run: choco install innosetup -y
        working-directory: .
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\KARIN_AI.iss'
        working-directory: .
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: KARIN-AI-Windows-Installer
          path: installer/output/Setup_KARIN_AI_Desktop.exe

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/android/KarinMobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK components
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_SDK_ROOT"
            find "$ANDROID_SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk KARIN_AI_Mobile.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: KARIN-AI-Android-APK
          path: src/android/KarinMobile/KARIN_AI_Mobile.apk
